<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Background: full-bleed opaque tile. Default: linear gradient #FBF6EE to #F1E5D2 (top to bottom);
    Dark: none, leave it to the system's dark background (as AppIcon-Dark.png does); Mono: black.
    In Icon Composer this can be the document's background fill instead of an SVG layer.
  -->
  <defs><linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024"><stop offset="0" stop-color="#FBF6EE"/><stop offset="1" stop-color="#F1E5D2"/></linearGradient></defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
</svg>
